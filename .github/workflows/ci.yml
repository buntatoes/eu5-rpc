name: CI

on:
  push:
    branches: [main, unstable]
  pull_request:
    branches: [main, unstable]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Run Zig unit tests
        run: zig build test

      - name: Build native release binary
        run: zig build -Doptimize=ReleaseSafe

      - name: Build Windows installer and Linux release bundle
        run: zig build package
